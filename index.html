<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo V2.1 - 事件委托 + 编辑</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
    background: #f5f6f8;
  }
  h1 { font-size: 24px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  #todo-input {
    flex: 1; padding: 10px 12px; font-size: 15px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  button {
    cursor: pointer; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; padding: 8px 14px; font-size: 14px;
  }
  #add-btn { background: #2563eb; color: #fff; border-color: #2563eb; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  #todo-list { list-style: none; padding: 0; margin: 0; }
  #todo-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 8px; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer;
  }
  #todo-list li.done .text { text-decoration: line-through; color: #999; }
  #todo-list li .text { flex: 1; }
  #todo-list li .actions { display: flex; gap: 6px; }
  #todo-list li button {
    background: transparent; border: none; font-size: 14px; padding: 2px 6px;
  }
  #todo-list li button[data-action="edit"] { color: #2563eb; }
  #todo-list li button[data-action="delete"] { color: #dc2626; font-size: 18px; }
  .stats { margin-top: 16px; font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1>Todo V2.1</h1>
<div class="input-row">
  <input id="todo-input" type="text" placeholder="输入任务，回车或点击添加">
  <button id="add-btn">添加</button>
</div>
<div class="filters">
  <button data-filter="all" class="active">全部</button>
  <button data-filter="active">未完成</button>
  <button data-filter="done">已完成</button>
</div>
<ul id="todo-list"></ul>
<div class="stats" id="stats"></div>

<script>
const KEY = 'todos';

const list       = document.querySelector('#todo-list');
const input      = document.querySelector('#todo-input');
const addBtn     = document.querySelector('#add-btn');
const stats      = document.querySelector('#stats');
const filterBtns = document.querySelectorAll('.filters button');

let todos = load();
let filter = 'all';
let editingId = null;   // 正在编辑的任务 id，null 表示不在编辑态

function save() {
  localStorage.setItem(KEY, JSON.stringify(todos));
}
function load() {
  const raw = localStorage.getItem(KEY);
  if (raw === null) return [];   // 没存过 -> 空数组
  return JSON.parse(raw);        // 存过 -> 解析
}

// 三个操作：改数据 -> 保存 -> 重渲染（不可变更新）
function addTodo(text) {
  todos = [...todos, { id: Date.now(), text, completed: false }];
  save(); render();
}
function removeTodo(id) {
  todos = todos.filter(t => t.id !== id);
  save(); render();
}
function toggleTodo(id) {
  todos = todos.map(t =>
    t.id === id ? { ...t, completed: !t.completed } : t);
  save(); render();
}
// 编辑分支：先把文本填入输入框，进入编辑态，保存时再更新数据
function editTodo(id) {
  const todo = todos.find(t => t.id === id);
  if (!todo) return;
  editingId = id;
  input.value = todo.text;
  input.focus();
  addBtn.textContent = '保存';
}
function saveEdit(text) {
  todos = todos.map(t => t.id === editingId ? { ...t, text } : t);
  save();
  editingId = null;
  addBtn.textContent = '添加';
  input.value = '';
  render();
}

function setFilter(f) {
  filter = f;
  render();
}

// 渲染：只负责“画”，不再给每个 li 单独绑事件
function render() {
  filterBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });

  list.innerHTML = '';

  const shown = todos.filter(t =>
    filter === 'all'  ? true :
    filter === 'done' ? t.completed : !t.completed);

  shown.forEach(t => {
    const li = document.createElement('li');
    li.dataset.id = t.id;
    if (t.completed) li.classList.add('done');

    const span = document.createElement('span');
    span.className = 'text';
    span.textContent = t.text;
    li.appendChild(span);

    const actions = document.createElement('span');
    actions.className = 'actions';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.dataset.action = 'edit';
    editBtn.textContent = '编辑';
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.dataset.action = 'delete';
    delBtn.textContent = '×';
    actions.appendChild(delBtn);

    li.appendChild(actions);
    list.appendChild(li);
  });

  const done = todos.reduce((n, t) => n + (t.completed ? 1 : 0), 0);
  stats.textContent = `共 ${todos.length} 项，已完成 ${done} 项`;
}

// 事件委托：只在父容器 ul 上绑一次监听
list.addEventListener('click', (e) => {
  if (!(e.target instanceof Element)) return;   // 边界：不是元素
  const item = e.target.closest('li');          // 找到任务项
  if (!item || !list.contains(item)) return;    // 边界：点不到 li / 不在本列表
  const id = Number(item.dataset.id);           // dataset 是字符串，转回数字
  if (!id) return;                              // 边界：没有 id

  const delBtn = e.target.closest('[data-action="delete"]');
  if (delBtn && item.contains(delBtn)) {
    removeTodo(id);
    return;                                     // 删除后立即结束，不再切换
  }

  const editBtn = e.target.closest('[data-action="edit"]');
  if (editBtn && item.contains(editBtn)) {
    editTodo(id);
    return;
  }

  toggleTodo(id);                               // 其它点击 -> 切换完成态
});

addBtn.addEventListener('click', () => {
  const text = input.value.trim();
  if (!text) return;
  if (editingId !== null) {
    saveEdit(text);
  } else {
    addTodo(text);
    input.value = '';
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addBtn.click();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

render();
</script>
</body>
</html>
